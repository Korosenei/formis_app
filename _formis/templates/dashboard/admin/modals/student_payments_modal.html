<script>
// ============================================
// CANDIDATURE MODAL FUNCTIONS
// ============================================

function viewCandidatureDetails(candidatureId) {
    const modal = document.getElementById('candidatureDetailsModal');
    const modalBody = document.getElementById('candidatureModalBody');

    modal.classList.add('show');
    modalBody.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Chargement...</p></div>';

    fetch(`/dashboard/admin/candidatures/${candidatureId}/details-ajax/`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderCandidatureDetails(data.candidature);
            } else {
                modalBody.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Erreur lors du chargement</p></div>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            modalBody.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Erreur de connexion</p></div>';
        });
}

function renderCandidatureDetails(candidature) {
    const modalBody = document.getElementById('candidatureModalBody');

    let html = `
        <div class="candidature-details">
            <!-- Informations personnelles -->
            <div class="detail-section">
                <h4><i class="fas fa-user"></i> Informations personnelles</h4>
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Nom complet</span>
                        <span class="detail-value">${candidature.candidat.nom_complet}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Genre</span>
                        <span class="detail-value">${candidature.candidat.genre}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Date de naissance</span>
                        <span class="detail-value">${candidature.candidat.date_naissance || '<span class="empty">Non renseigné</span>'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Lieu de naissance</span>
                        <span class="detail-value">${candidature.candidat.lieu_naissance || '<span class="empty">Non renseigné</span>'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${candidature.candidat.email}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Téléphone</span>
                        <span class="detail-value">${candidature.candidat.telephone}</span>
                    </div>
                </div>
            </div>

            <!-- Formation -->
            <div class="detail-section">
                <h4><i class="fas fa-graduation-cap"></i> Formation souhaitée</h4>
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Établissement</span>
                        <span class="detail-value">${candidature.formation.etablissement}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Département</span>
                        <span class="detail-value">${candidature.formation.departement || '<span class="empty">-</span>'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Filière</span>
                        <span class="detail-value">${candidature.formation.filiere}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Niveau</span>
                        <span class="detail-value">${candidature.formation.niveau}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Année académique</span>
                        <span class="detail-value">${candidature.formation.annee_academique}</span>
                    </div>
                </div>
            </div>

            <!-- Statut -->
            <div class="detail-section">
                <h4><i class="fas fa-info-circle"></i> Statut de la candidature</h4>
                <div class="status-timeline">
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">Candidature soumise</div>
                            <div class="timeline-date">${candidature.statut.date_soumission || 'Non soumise'}</div>
                        </div>
                    </div>
                    ${candidature.statut.examine_par ? `
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">Examinée par ${candidature.statut.examine_par}</div>
                            <div class="timeline-date">${candidature.statut.date_decision || ''}</div>
                        </div>
                    </div>
                    ` : ''}
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-${candidature.statut.code === 'APPROUVEE' ? 'check' : candidature.statut.code === 'REJETEE' ? 'times' : 'clock'}"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">Statut actuel: ${candidature.statut.label}</div>
                            ${candidature.statut.notes ? `<div class="timeline-date">${candidature.statut.notes}</div>` : ''}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Documents -->
            <div class="detail-section">
                <h4><i class="fas fa-file-alt"></i> Documents fournis (${candidature.documents.length})</h4>
                <div class="documents-list">
                    ${candidature.documents.length > 0 ? candidature.documents.map(doc => `
                        <div class="document-item">
                            <div class="document-info">
                                <div class="document-icon">
                                    <i class="fas fa-file-pdf"></i>
                                </div>
                                <div class="document-details">
                                    <h5>${doc.nom}</h5>
                                    <div class="document-meta">
                                        ${doc.type} • ${doc.taille}
                                        ${doc.valide ? '<span class="badge-status badge-valide"><i class="fas fa-check"></i> Validé</span>' : '<span class="badge-status badge-non-valide"><i class="fas fa-clock"></i> En attente</span>'}
                                    </div>
                                </div>
                            </div>
                            <div class="document-actions">
                                <a href="${doc.url}" target="_blank" class="btn-icon-sm btn-primary" title="Voir">
                                    <i class="fas fa-eye"></i>
                                </a>
                                ${!doc.valide ? `
                                <button class="btn-icon-sm btn-success" onclick="validateDocument('${doc.id}')" title="Valider">
                                    <i class="fas fa-check"></i>
                                </button>
                                ` : ''}
                            </div>
                        </div>
                    `).join('') : '<div class="empty-state"><i class="fas fa-file"></i><p>Aucun document fourni</p></div>'}
                </div>
            </div>
        </div>
    `;

    // Actions footer
    let footerHtml = '<div class="modal-footer">';

    if (candidature.actions_possibles.peut_examiner) {
        footerHtml += `<button class="btn btn-primary" onclick="startCandidatureExam('${candidature.id}')">
            <i class="fas fa-search"></i> Commencer l'examen
        </button>`;
    }

    if (candidature.actions_possibles.peut_approuver) {
        footerHtml += `<button class="btn btn-primary" onclick="approveCandidature('${candidature.id}')">
            <i class="fas fa-check"></i> Approuver
        </button>`;
    }

    if (candidature.actions_possibles.peut_rejeter) {
        footerHtml += `<button class="btn btn-outline" onclick="rejectCandidature('${candidature.id}')">
            <i class="fas fa-times"></i> Rejeter
        </button>`;
    }

    if (candidature.actions_possibles.peut_creer_inscription) {
        footerHtml += `<button class="btn btn-primary" onclick="createInscription('${candidature.id}')">
            <i class="fas fa-user-plus"></i> Créer inscription
        </button>`;
    }

    footerHtml += '<button class="btn btn-outline" onclick="closeCandidatureModal()">Fermer</button></div>';

    modalBody.innerHTML = html + footerHtml;
}

function closeCandidatureModal() {
    document.getElementById('candidatureDetailsModal').classList.remove('show');
}

function startCandidatureExam(candidatureId) {
    if (confirm('Commencer l\'examen de cette candidature ?')) {
        fetch(`/dashboard/admin/candidatures/${candidatureId}/start-exam/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                closeCandidatureModal();
                location.reload();
            } else {
                alert(data.message || 'Erreur');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Erreur de connexion');
        });
    }
}

function approveCandidature(candidatureId) {
    const notes = prompt('Notes d\'approbation (optionnel):');
    if (notes !== null) {
        fetch(`/dashboard/admin/candidatures/${candidatureId}/approve/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({notes: notes})
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Candidature approuvée avec succès');
                closeCandidatureModal();
                location.reload();
            } else {
                alert(data.message || 'Erreur');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Erreur de connexion');
        });
    }
}

function rejectCandidature(candidatureId) {
    const motif = prompt('Motif de rejet:');
    if (motif) {
        fetch(`/dashboard/admin/candidatures/${candidatureId}/reject/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({motif: motif})
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                closeCandidatureModal();
                location.reload();
            } else {
                alert(data.message || 'Erreur');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Erreur de connexion');
        });
    }
}

// ============================================
// PAYMENTS MODAL FUNCTIONS
// ============================================

function viewStudentPayments(studentId) {
    const modal = document.getElementById('studentPaymentsModal');
    const modalBody = document.getElementById('paymentsModalBody');

    modal.classList.add('show');
    modalBody.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Chargement...</p></div>';

    fetch(`/dashboard/admin/students/${studentId}/payments-modal/`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderPaymentsModal(data.data);
            } else {
                modalBody.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>${data.message || 'Erreur'}</p></div>`;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            modalBody.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Erreur de connexion</p></div>';
        });
}

function renderPaymentsModal(data) {
    const modalBody = document.getElementById('paymentsModalBody');

    const pourcentage = ((data.inscription.total_paye / data.inscription.frais_total) * 100).toFixed(1);

    let html = `
        <!-- Student Info -->
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h4 style="margin: 0 0 5px 0;">${data.etudiant.nom_complet}</h4>
            <p style="margin: 0; opacity: 0.9; font-size: 13px;">Matricule: ${data.etudiant.matricule} • Inscription: ${data.inscription.numero}</p>
        </div>

        <!-- Overview Cards -->
        <div class="payments-overview">
            <div class="overview-card">
                <div class="overview-label">Frais Total</div>
                <div class="overview-value">${formatMoney(data.inscription.frais_total)}</div>
                <div class="overview-subtext">FCFA</div>
            </div>
            <div class="overview-card success">
                <div class="overview-label">Total Payé</div>
                <div class="overview-value">${formatMoney(data.inscription.total_paye)}</div>
                <div class="overview-subtext">${pourcentage}%</div>
            </div>
            <div class="overview-card ${data.inscription.solde > 0 ? 'warning' : 'success'}">
                <div class="overview-label">Solde Restant</div>
                <div class="overview-value">${formatMoney(data.inscription.solde)}</div>
                <div class="overview-subtext">FCFA</div>
            </div>
            <div class="overview-card ${data.inscription.solde > 0 ? 'danger' : 'success'}">
                <div class="overview-label">Statut</div>
                <div class="overview-value" style="font-size: 14px;">${data.inscription.statut_paiement}</div>
                <div class="overview-subtext">${data.inscription.type_paiement}</div>
            </div>
        </div>

        <!-- Prochaine Tranche -->
        ${data.prochaine_tranche ? `
        <div class="next-payment-box">
            <h5><i class="fas fa-exclamation-triangle"></i> Prochaine tranche à payer</h5>
            <div class="next-payment-details">
                <div class="detail-item">
                    <span class="detail-label">Tranche</span>
                    <span class="detail-value">${data.prochaine_tranche.nom}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Montant</span>
                    <span class="detail-value">${formatMoney(data.prochaine_tranche.montant)} FCFA</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Date limite</span>
                    <span class="detail-value">${data.prochaine_tranche.date_limite || 'Non définie'}</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="initiatePaymentForStudent('${data.etudiant.id}')">
                <i class="fas fa-credit-card"></i> Effectuer le paiement
            </button>
        </div>
        ` : ''}

        <!-- Historique des Paiements -->
        <div class="payments-section">
            <div class="section-header">
                <h4><i class="fas fa-history"></i> Historique des paiements</h4>
            </div>
            ${data.paiements.length > 0 ? `
            <table class="payments-table">
                <thead>
                    <tr>
                        <th>N° Transaction</th>
                        <th>Tranche</th>
                        <th>Montant</th>
                        <th>Date</th>
                        <th>Méthode</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${data.paiements.map(p => `
                    <tr>
                        <td><code style="font-size: 11px;">${p.numero}</code></td>
                        <td>${p.tranche}</td>
                        <td><strong>${formatMoney(p.montant)} FCFA</strong></td>
                        <td><small>${p.date}</small></td>
                        <td>${p.methode}</td>
                        <td>
                            <span class="payment-status ${p.statut.toLowerCase().replace(' ', '-')}">
                                ${p.statut}
                            </span>
                        </td>
                        <td>
                            <button class="btn-icon-sm btn-primary" onclick="viewPaymentDetails('${p.id}')" title="Voir">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                    `).join('')}
                </tbody>
            </table>
            ` : '<div class="empty-state"><i class="fas fa-credit-card"></i><p>Aucun paiement enregistré</p></div>'}
        </div>
    `;

    let footerHtml = `
        <div class="modal-footer">
            ${data.peut_payer ? `
            <button class="btn btn-primary" onclick="initiatePaymentForStudent('${data.etudiant.id}')">
                <i class="fas fa-plus"></i> Nouveau paiement
            </button>
            ` : ''}
            <button class="btn btn-outline" onclick="closePaymentsModal()">Fermer</button>
        </div>
    `;

    modalBody.innerHTML = html + footerHtml;
}

function closePaymentsModal() {
    document.getElementById('studentPaymentsModal').classList.remove('show');
}

function initiatePaymentForStudent(studentId) {
    if (confirm('Créer un paiement pour cet étudiant ?')) {
        fetch(`/dashboard/admin/students/${studentId}/initiate-payment/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken'),
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                closePaymentsModal();
                window.location.href = data.redirect_url;
            } else {
                alert(data.message || 'Erreur lors de la création du paiement');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Erreur de connexion');
        });
    }
}

function viewPaymentDetails(paiementId) {
    window.location.href = `/dashboard/admin/paiements/${paiementId}/`;
}

// ============================================
// UTILITY FUNCTIONS
// ============================================

function formatMoney(amount) {
    return new Intl.NumberFormat('fr-FR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    }).format(amount);
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Close modals on ESC key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeCandidatureModal();
        closePaymentsModal();
    }
});

// Close modals on outside click
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('modal')) {
        e.target.classList.remove('show');
    }
});
</script>
